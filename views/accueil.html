<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURIVA — Parfums d'exception</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="../assets/css/accueil.css" />

  
</head>
<body>

  <nav class="navbar">
    <div class="nav-left">
      <a href="accueil.html" class="logo">AURIVA</a>
      <a href="accueil.html" class="nav-link active">Accueil</a>
      <a href="panier.html" class="nav-link">
        Panier
        <span class="cart-badge" id="cartCount">0</span>
      </a>
      <a href="suivi.html" class="nav-link">Suivi</a>
      <a href="historique.html" class="nav-link">Historique</a>
      <a href="contact.html" class="nav-link">Contact</a>
      <!-- Admin only : visible uniquement si role = admin -->
      <a href="../admin/gestion_produits.html" class="nav-link admin-only">Produits</a>
      <a href="../admin/gestion_clients.html" class="nav-link admin-only">Clients</a>
      <a href="../admin/statistiques.html" class="nav-link admin-only">Statistiques</a>
    </div>
    <div class="nav-right">
      <div class="user-menu" id="userMenu">
        <button class="user-btn" onclick="toggleUserMenu()">
          &#9776;
          <span id="userName">Compte</span>
        </button>
        <div class="user-dropdown" id="userDropdown">
          <a href="login.html">Se connecter</a>
          <a href="register.html">S'inscrire</a>
        </div>
      </div>
    </div>
  </nav>

  <section class="hero">
    <h1>Découvrez nos parfums d'exception</h1>
    <p>Explorez notre collection et trouvez votre signature olfactive</p>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Rechercher un parfum, une marque..." />
      <select id="searchCategory">
        <option value="">Toutes catégories</option>
        <option value="femme">Femme</option>
        <option value="homme">Homme</option>
        <option value="mixte">Mixte</option>
      </select>
      <button onclick="searchProducts()">Chercher</button>
    </div>
  </section>

  <div class="main-layout">

    <aside class="sidebar">
      <h3 class="filter-title">FILTRES</h3>

      <div class="filter-group">
        <label>Marque</label>
        <select id="filterMarque" onchange="applyFilters()">
          <option value="">Toutes</option>
          <option value="Chanel">Chanel</option>
          <option value="Dior">Dior</option>
          <option value="YSL">YSL</option>
          <option value="Guerlain">Guerlain</option>
          <option value="Hermès">Hermès</option>
          <option value="Givenchy">Givenchy</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Prix max (MAD)</label>
        <input type="range" id="filterPrix" min="100" max="3000" value="3000" step="50"
          oninput="document.getElementById('prixVal').textContent = '≤ ' + this.value + ' MAD'; applyFilters()" />
        <span class="prix-val" id="prixVal">≤ 3000 MAD</span>
      </div>

      <div class="filter-group">
        <label>Famille olfactive</label>
        <select id="filterFamille" onchange="applyFilters()">
          <option value="">Toutes</option>
          <option value="Floral">Floral</option>
          <option value="Oriental">Oriental</option>
          <option value="Boisé">Boisé</option>
          <option value="Frais">Frais</option>
          <option value="Fruité">Fruité</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Taille</label>
        <select id="filterTaille" onchange="applyFilters()">
          <option value="">Toutes</option>
          <option value="30ml">30 ml</option>
          <option value="50ml">50 ml</option>
          <option value="100ml">100 ml</option>
          <option value="200ml">200 ml</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Genre</label>
        <select id="filterGenre" onchange="applyFilters()">
          <option value="">Tous</option>
          <option value="Femme">Femme</option>
          <option value="Homme">Homme</option>
          <option value="Mixte">Mixte</option>
        </select>
      </div>

      <button class="reset-btn" onclick="resetFilters()">Réinitialiser</button>
    </aside>

    <section class="products-section">
      <div class="products-header">
        <span id="productCount">24 parfums trouvés</span>
        <select id="sortSelect" onchange="sortProducts()">
          <option value="prix-asc">Prix croissant</option>
          <option value="prix-desc">Prix décroissant</option>
          <option value="nouveau">Nouveautés</option>
        </select>
      </div>
      <div class="products-grid" id="productsGrid"></div>
    </section>

  </div>


<script src="../assets/js/accueil.js"></script>
</body>
</html>
